version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/user/queries.sql"
    schema: "sql/schema.sql"
    gen:
      go:
        package: "user"
        out: "internal/core/db/user"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_db_tags: true
        emit_prepared_queries: true
        emit_interface: false
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

  - engine: "postgresql"
    queries: "sql/categories/queries.sql"
    schema: "sql/schema.sql"
    gen:
      go:
        package: "categories"
        out: "internal/core/db/categories"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_db_tags: true
        emit_prepared_queries: true
        emit_interface: false
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true